<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام ترويج الأرقام</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ============================================================ */
        /*                      الأنماط العامة (كما هي)                 */
        /* ============================================================ */
        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --accent: #00ff9d;
            --dark: #0c0b1e;
            --light: #ffffff;
            --card-bg: linear-gradient(145deg, #1a1a2e, #16213e);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --gradient-4: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --admin: #ffb347;
            --supervisor: #00d4ff;
            --warning: #ffb347;
            --ticket-pending: #ffb347;
            --ticket-waiting: #ff8c00;
            --ticket-verified: #4facfe;
            --ticket-done: #43e97b;
            --ticket-failed: #f5576c;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        body {
            background: linear-gradient(135deg, var(--dark) 0%, #1a1036 100%);
            color: var(--light);
            min-height: 100vh;
            padding: 10px;
            font-size: 14px;
            overflow-x: hidden;
        }
        .app-logo {
            text-align: center;
            margin: 10px auto 20px;
            padding: 15px;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(10px);
        }
        .app-logo h1 {
            color: var(--accent);
            font-size: 1.4rem;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-shadow: 0 2px 10px rgba(106,17,203,0.5);
        }
        .app-logo p {
            color: rgba(255,255,255,0.8);
            font-size: 0.85rem;
        }
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 10px;
        }
        .auth-box {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 25px 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(255,255,255,0.15);
            position: relative;
            overflow: hidden;
        }
        .auth-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-1);
        }
        .auth-title {
            text-align: center;
            margin-bottom: 25px;
            color: var(--accent);
            font-size: 1.4rem;
            text-shadow: 0 2px 8px rgba(0,255,157,0.3);
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .input-group {
            position: relative;
        }
        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent);
            font-size: 1.1rem;
            z-index: 2;
        }
        .phone-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
        }
        .country-select {
            width: 140px;
            flex-shrink: 0;
            padding: 16px 12px;
            background: rgba(255,255,255,0.07);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }
        .country-select option {
            background: #1a1a2e;
            color: white;
        }
        .phone-field {
            flex: 1;
            padding: 16px 18px;
            background: rgba(255,255,255,0.07);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            color: white;
        }
        input,
        select,
        textarea {
            width: 100%;
            padding: 16px 45px 16px 15px;
            border: 2px solid transparent;
            border-radius: 15px;
            background: rgba(255,255,255,0.07);
            color: var(--light);
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 0 3px rgba(0, 255, 157, 0.2);
            transform: translateY(-2px);
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }
        .btn {
            padding: 16px 24px;
            border: none;
            border-radius: 15px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-top: 5px;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }
        .btn:hover::before {
            left: 100%;
        }
        .btn-primary {
            background: var(--gradient-1);
            color: white;
            box-shadow: 0 6px 20px rgba(106, 17, 203, 0.4);
        }
        .btn-success {
            background: var(--gradient-4);
            color: white;
            box-shadow: 0 6px 20px rgba(67, 233, 123, 0.4);
        }
        .btn-danger {
            background: var(--gradient-2);
            color: white;
            box-shadow: 0 6px 20px rgba(240, 147, 251, 0.4);
        }
        .btn-info {
            background: var(--gradient-3);
            color: white;
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.4);
        }
        .btn-warning {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: white;
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
        }
        .btn-admin {
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            color: white;
            box-shadow: 0 6px 20px rgba(255, 94, 98, 0.4);
        }
        .btn-supervisor {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.4);
        }
        .btn-promoter {
            background: var(--gradient-2);
            color: white;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(106, 17, 203, 0.5);
        }
        .btn-small {
            padding: 10px 16px;
            font-size: 13px;
            border-radius: 12px;
            width: auto;
            min-width: 80px;
        }
        .auth-footer {
            text-align: center;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .auth-link {
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            padding: 10px;
            border-radius: 10px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
        }
        .auth-link:hover {
            background: rgba(0, 255, 157, 0.1);
            transform: translateY(-2px);
        }
        .forgot-password-link {
            color: var(--accent);
            cursor: pointer;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255, 180, 70, 0.1);
            border: 1px solid rgba(255, 180, 70, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }
        .forgot-password-link:hover {
            background: rgba(255, 180, 70, 0.2);
            transform: translateY(-2px);
            border-color: #ffb347;
        }
        #appContent {
            display: none;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            gap: 15px;
        }
        .app-header {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: var(--card-shadow);
            margin-bottom: 10px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            min-width: 200px;
        }
        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 20px;
            background: var(--gradient-1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 24px;
            color: white;
            flex-shrink: 0;
            box-shadow: 0 6px 20px rgba(106, 17, 203, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.2);
        }
        .user-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }
        .user-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 8px rgba(0, 255, 157, 0.3);
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .support-btn {
            background: rgba(255, 107, 107, 0.15);
            border: 2px solid #ff6b6b;
            color: white;
            padding: 12px 20px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 15px #ff6b6b50;
        }
        .support-btn:hover {
            background: #ff6b6b;
            transform: translateY(-3px);
            box-shadow: 0 0 30px #ff6b6b;
        }
        .logout-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--light);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 12px 18px;
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .logout-btn:hover {
            background: rgba(240, 147, 251, 0.2);
            border-color: rgba(240, 147, 251, 0.5);
            transform: translateY(-2px);
        }
        .role-badge {
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
            width: fit-content;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        .role-admin {
            background: var(--admin);
            color: black;
        }
        .role-supervisor {
            background: var(--supervisor);
            color: black;
        }
        .role-promoter {
            background: var(--gradient-1);
            color: white;
        }
        .role-beneficiary {
            background: var(--gradient-3);
            color: white;
        }
        .role-suspended-beneficiary {
            background: var(--gradient-2);
            color: white;
        }
        .stats-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 15px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 12px 5px !important;
            text-align: center;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: var(--card-shadow);
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }
        .stat-card:nth-child(1) {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
        }
        .stat-card:nth-child(2) {
            background: linear-gradient(145deg, #1e3c72, #2a5298);
        }
        .stat-card:nth-child(3) {
            background: linear-gradient(145deg, #0f2027, #203a43);
        }
        .stat-card:nth-child(4) {
            background: linear-gradient(145deg, #141e30, #243b55);
        }
        .stat-value {
            font-size: 1.2rem !important;
            font-weight: 800;
            margin: 2px 0 !important;
            color: var(--accent);
            text-shadow: 0 2px 10px rgba(0, 255, 157, 0.5);
        }
        .stat-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 9px !important;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stat-card.suspended {
            background: linear-gradient(145deg, #3a1a1a, #4e1e1e) !important;
            padding: 12px 5px !important;
        }
        .stat-card.suspended .stat-value {
            color: #f5576c;
            font-size: 1.2rem !important;
            margin: 2px 0 !important;
        }
        .stat-card.suspended .stat-label {
            color: rgba(255, 255, 255, 0.8) !important;
            font-size: 9px !important;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .switch-container {
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid var(--supervisor);
            border-radius: 40px;
            padding: 12px 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: nowrap;
            gap: 10px;
            box-shadow: 0 0 25px #00d4ff60;
        }
        .switch-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--supervisor);
            white-space: nowrap;
        }
        .switch-toggle {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px;
            border-radius: 30px;
            flex-shrink: 0;
        }
        .switch-option {
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            transition: 0.2s;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
        }
        .switch-option.active {
            background: var(--supervisor);
            color: black;
            box-shadow: 0 0 20px var(--supervisor);
        }
        .permissions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 10px;
        }
        .permission-switch-row {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: 0.2s;
            width: 100%;
        }
        .permission-switch-row:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
        }
        .permission-label {
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .permission-label i {
            color: var(--accent);
            width: 18px;
            text-align: center;
            font-size: 0.9rem;
        }
        .permission-toggle {
            display: flex;
            gap: 4px;
            background: rgba(0, 0, 0, 0.3);
            padding: 3px;
            border-radius: 30px;
            width: 100%;
            justify-content: center;
        }
        .permission-option {
            padding: 5px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.75rem;
            transition: 0.2s;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            border: none;
            flex: 1;
            justify-content: center;
        }
        .permission-option.active-on {
            background: #2ecc71;
            color: white;
            box-shadow: 0 0 12px rgba(46, 204, 113, 0.3);
        }
        .permission-option.active-off {
            background: #e74c3c;
            color: white;
            box-shadow: 0 0 12px rgba(231, 76, 60, 0.3);
        }
        .permission-option i {
            font-size: 0.65rem;
        }
        .tabs-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: var(--card-shadow);
        }
        .tabs {
            display: flex;
            gap: 5px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 16px 8px;
            cursor: pointer;
            border-radius: 15px;
            transition: all 0.3s;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 14px;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
        }
        .tab.active {
            background: var(--gradient-1);
            color: white;
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 6px 20px rgba(106, 17, 203, 0.4);
            transform: translateY(-2px);
        }
        .tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 10px;
        }
        .action-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
        }
        .action-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-1);
        }
        .action-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border-color: rgba(106, 17, 203, 0.5);
        }
        .action-icon {
            font-size: 2.2rem;
            margin-bottom: 15px;
            color: var(--accent);
            text-shadow: 0 2px 10px rgba(0, 255, 157, 0.5);
        }
        .action-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--light);
        }
        .action-desc {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.4;
        }
        .numbers-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .number-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 15px 18px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: visible;
            box-shadow: var(--card-shadow);
            min-height: 140px;
            margin-bottom: 12px;
        }
        .number-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            background: var(--gradient-1);
        }
        .number-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
            flex-wrap: nowrap;
            min-height: 40px;
        }
        .number-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            direction: ltr;
            text-align: left;
            unicode-bidi: bidi-override;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            text-shadow: 0 2px 10px rgba(0, 255, 157, 0.5);
            flex: 1;
            line-height: 1.3;
            padding: 8px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .number-type {
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
            white-space: nowrap;
            margin: 0;
        }
        .type-owner {
            background: var(--gradient-1);
            color: white;
        }
        .type-beneficiary {
            background: var(--gradient-3);
            color: white;
        }
        .type-promoter {
            background: var(--gradient-3);
            color: white;
        }
        [dir="rtl"] .number-value {
            text-align: right;
        }
        .number-info {
            margin-bottom: 15px;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
        }
        .info-item i {
            color: var(--accent);
            width: 14px;
            font-size: 12px;
        }
        .number-notes-container {
            margin-top: 12px;

        let trackingInterval = null;

        // ============================================================
        //                      دوال مساعدة لتوليد أرقام بطول 6
        // ============================================================
        function generateSixDigitNumber() {
            let num = '';
            for (let i = 0; i < 6; i++) {
                num += Math.floor(Math.random() * 10);
            }
            return num;
        }

        // ============================================================
        //                      دالة تنظيف الاسم
        // ============================================================
        function limitWords(input) {
            let words = input.value.trim().split(/\s+/).filter(w => w.length > 0);
            if (words.length > 2) {
                words = words.slice(0, 2);
                input.value = words.join(' ');

        // ============================================================
        //                      دوال الاتصال بقاعدة البيانات
        // ============================================================
        async function supabaseFetch(endpoint, method = 'GET', data = null) {
            if (!isOnline) {
                showOfflinePage();
                throw new Error('لا يوجد اتصال بالإنترنت');
            }
            try {
                const url = `${SUPABASE_URL}/rest/v1/${endpoint}`;
                const options = {
                    method,
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    signal: AbortSignal.timeout(10000)
                };
                if (data) options.body = JSON.stringify(data);
                const response = await fetch(url, options);
                if (!response.ok) throw new Error(`خطأ في الخادم: ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error('خطأ في supabaseFetch:', error);
                if (error.name === 'AbortError' || error.message.includes('Failed to fetch')) {
                    isOnline = false;
                    showOfflinePage();
                }
                throw error;
            }
        }

        // ============================================================
        //                      تحميل البيانات
        // ============================================================
        async function loadAllData() {
            try {
                const [usersData, numbersData, beneficiariesData, ticketsData] = await Promise.all([
                    supabaseFetch('users?select=*'),
                    supabaseFetch('numbers?select=*'),
                    supabaseFetch('beneficiaries?select=*'),
                    supabaseFetch('tickets?select=*')
                ]);
                users = usersData || [];
                numbers = numbersData || [];
                beneficiaries = beneficiariesData || [];
                tickets = ticketsData || [];
                lastUpdateTime = new Date();
                return true;
            } catch (error) {
                console.error('خطأ في تحميل البيانات:', error);
                return false;
            }
        }

        // ============================================================
        //                      مراقبة الاتصال
        // ============================================================
        function initConnectionMonitoring() {
            isOnline = navigator.onLine;
            updateConnectionStatus();
            window.addEventListener('online', handleConnectionChange);
            window.addEventListener('offline', handleConnectionChange);
            connectionCheckInterval = setInterval(checkConnection, 5000);
            checkConnection();
            startPolling();
        }

        function handleConnectionChange() {
            const wasOnline = isOnline;
            isOnline = navigator.onLine;
            if (isOnline && !wasOnline) {
                hideOfflinePage();
                loadAllData().then(() => { if (currentUser) renderContent(); });
            } else if (!isOnline && wasOnline) {
                showOfflinePage();
            }
            updateConnectionStatus();
        }

        function checkConnection() {
            if (!navigator.onLine && isOnline) {
                isOnline = false;
                showOfflinePage();
            } else if (navigator.onLine && !isOnline) {
                isOnline = true;
                hideOfflinePage();
                loadAllData().then(() => { if (currentUser) renderContent(); });
            }
            updateConnectionStatus();
        }

        function updateConnectionStatus() {
            const statusEl = document.getElementById('connectionStatus');
            if (statusEl) {
                if (isOnline) {
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString('ar-AR', { hour: '2-digit', minute: '2-digit' });
                    statusEl.innerHTML = `✅ الاتصال نشط - آخر تحديث: ${timeStr}`;
                    statusEl.style.color = '#27ae60';
                } else {
                    statusEl.innerHTML = '📡 جاري محاولة الاتصال تلقائيًا...';
                    statusEl.style.color = '#ffcc00';
                }
            }
        }

            document.getElementById('offlinePage').style.display = 'flex';
            document.getElementById('appContent').style.display = 'none';
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('appLogo').style.display = 'none';

        function hideOfflinePage() {
            document.getElementById('offlinePage').style.display = 'none';
            if (currentUser) {
                document.getElementById('appContent').style.display = 'flex';
            } else {
                document.getElementById('authSection').style.display = 'flex';
                document.getElementById('appLogo').style.display = 'block';
            }

        function startPolling() {
            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(async () => {
                if (isOnline && !isLoading && currentUser) {
                    await checkForUpdates();
                }
            }, 3000);
        }

        async function checkForUpdates() {
            try {
                const [newUsers, newNumbers, newBeneficiaries, newTickets] = await Promise.all([
                    supabaseFetch('users?select=*'),
                    supabaseFetch('numbers?select=*'),
                    supabaseFetch('beneficiaries?select=*'),
                    supabaseFetch('tickets?select=*')
                ]);
                const usersChanged = JSON.stringify(users) !== JSON.stringify(newUsers);
                const numbersChanged = JSON.stringify(numbers) !== JSON.stringify(newNumbers);
                const beneficiariesChanged = JSON.stringify(beneficiaries) !== JSON.stringify(newBeneficiaries);
                const ticketsChanged = JSON.stringify(tickets) !== JSON.stringify(newTickets);
                if (usersChanged || numbersChanged || beneficiariesChanged || ticketsChanged) {
                    users = newUsers || [];
                    numbers = newNumbers || [];
                    beneficiaries = newBeneficiaries || [];
                    tickets = newTickets || [];
                    if (currentUser) {
                        const updatedCurrentUser = users.find(u => u.id === currentUser.id);
                        if (updatedCurrentUser) {
                            if (updatedCurrentUser.role !== currentUser.role ||
                                JSON.stringify(updatedCurrentUser.permissions) !== JSON.stringify(currentUser.permissions)) {
                                currentUser = updatedCurrentUser;
                                renderContent();
                                updateUserInfo();
                            } else {
                                currentUser = updatedCurrentUser;
                            }
                        }
                    }
                    if (currentUser) {
                        if (currentUser.role === 'admin') {
                            if (document.getElementById('adminSearchInput')) searchUsers();
                        } else if (currentUser.role === 'supervisor' && userMode === 'supervisor') {
                            if (document.getElementById('supervisorSearchInput')) searchSupervisorUsers();
                        } else {
                            if (currentTab === 'my') renderMyNumbers();
                            else if (currentTab === 'promo') renderPromoTab();
                            else if (currentTab === 'beneficiaries') renderBeneficiariesTab();
                        }
                        updateStats();
                        updateUserInfo();
                    }
                }
            } catch (error) { /* تجاهل */ }
        }

        function cleanCode(str) {
            return String(str).replace(/\D/g, '');
        }

        function cleanName(name) {
            return name.replace(/\s+/g, ' ').trim();
        }

        // ============================================================
        //                      تسجيل الدخول
        // ============================================================
        async function login() {
            const name = cleanName(document.getElementById('loginName').value);
            const code = cleanCode(document.getElementById('loginCode').value);
            if (!name || !code || code.length !== 6) { showAlert('يرجى إدخال جميع البيانات بشكل صحيح', 'error'); return; }

            const wordCount = name.split(' ').filter(w => w.length > 0).length;
            if (wordCount < 1 || wordCount > 2) {
                showAlert('اسم المستخدم يجب أن يكون كلمة واحدة أو كلمتين فقط', 'error');
                return;
            }

            try {
                const userData = await supabaseFetch(`users?name=eq.${name}&login_code=eq.${code}&select=*`);
                if (userData && userData.length > 0) {
                    currentUser = userData[0];
                    userMode = currentUser.role === 'supervisor' ? 'supervisor' : 'user';
                    await loadAllData();
                    showAppContent();
                    showAlert('مرحباً بك!', 'success');
                } else {
                    showAlert('اسم المستخدم أو كود الدخول غير صحيح', 'error');
                }
            } catch (error) {
                showAlert('حدث خطأ في الاتصال', 'error');
            }
        }

        // ============================================================
        //                      إنشاء حساب (مع رقم الهاتف)
        // ============================================================
        async function register() {
            const name = cleanName(document.getElementById('registerName').value);
            const countryCode = document.getElementById('countryCode').value;
            const phone = document.getElementById('phoneNumber').value.trim();
            const loginCode = cleanCode(document.getElementById('loginPassword').value);
            const confirmCode = cleanCode(document.getElementById('confirmLoginPassword').value);

            if (!name || !phone || !loginCode || !confirmCode) { showAlert('يرجى ملء جميع الحقول', 'error'); return; }
            if (loginCode.length !== 6) { showAlert('كود الدخول يجب أن يكون 6 أرقام', 'error'); return; }
            if (loginCode !== confirmCode) { showAlert('كود التأكيد غير متطابق', 'error'); return; }
            if (!countryCode) { showAlert('يرجى اختيار رمز الدولة', 'error'); return; }

            const wordCount = name.split(' ').filter(w => w.length > 0).length;
            if (wordCount < 1 || wordCount > 2) {
                showAlert('اسم المستخدم يجب أن يكون كلمة واحدة أو كلمتين فقط', 'error');
                return;
            }

            const existingUser = await supabaseFetch(`users?name=eq.${name}&select=name`);
            if (existingUser && existingUser.length > 0) { showAlert('اسم المستخدم موجود مسبقاً', 'error'); return; }
            const existingCode = await supabaseFetch(`users?login_code=eq.${loginCode}&select=login_code`);
            if (existingCode && existingCode.length > 0) { showAlert('كود الدخول هذا مستخدم بالفعل', 'error'); return; }
            const existingPhone = await supabaseFetch(`users?phone=eq.${countryCode}${phone}&select=phone`);
            if (existingPhone && existingPhone.length > 0) { showAlert('رقم الهاتف هذا مستخدم بالفعل', 'error'); return; }

            let promoCode;
            let isUnique = false;
            while (!isUnique) {
                promoCode = generateSixDigitNumber();
                const existingPromo = await supabaseFetch(`users?promo_code=eq.${promoCode}&select=promo_code`);
                if (!existingPromo || existingPromo.length === 0) isUnique = true;
            }

            const fullPhone = countryCode + phone;
            const newUser = {
                name: name,
                login_code: loginCode,
                promo_code: promoCode,
                phone: fullPhone,
                role: 'promoter',
                permissions: null,
                promoter_id: null,
                created_at: new Date().toISOString()
            };
            try {
                const result = await supabaseFetch('users', 'POST', newUser);
                if (result && result.length > 0) {
                    showAlert(`تم إنشاء الحساب بنجاح! كود ترويجك: ${promoCode}`, 'success');
                    showLogin();
                }
            } catch (error) {
                showAlert('حدث خطأ في إنشاء الحساب', 'error');
            }
        }

        // ============================================================
        //                      طلب استعادة كود الدخول
        // ============================================================
        async function createForgotTicket() {
            const identifier = cleanName(document.getElementById('forgotUserName').value);
            if (!identifier) { showAlert('يرجى إدخال اسم المستخدم أو رقم الهاتف', 'error'); return; }

            let userData;
            if (/^[\+\d]+$/.test(identifier)) {
                userData = await supabaseFetch(`users?phone=eq.${identifier}&select=*`);
            } else {
                userData = await supabaseFetch(`users?name=eq.${identifier}&select=*`);
            }

            if (!userData || userData.length === 0) { showAlert('المستخدم غير موجود', 'error'); return; }
            const user = userData[0];

            if (!user.phone) {
                showAlert('لا يوجد رقم هاتف مسجل لهذا المستخدم، يرجى التواصل مع الدعم.', 'error');
                return;
            }

            const activeTickets = tickets.filter(t => t.user_id === user.id && ['pending', 'waiting', 'verified'].includes(t.status));
            for (const t of activeTickets) {
                await supabaseFetch(`tickets?id=eq.${t.id}`, 'PATCH', { status: 'failed', failed_reason: 'تم إنشاء طلب جديد' });
            }

            let ticketId;
            let idUnique = false;
            while (!idUnique) {
                ticketId = generateSixDigitNumber();
                const existing = await supabaseFetch(`tickets?id=eq.${ticketId}&select=id`);
                if (!existing || existing.length === 0) idUnique = true;
            }

            const newTicket = {
                id: ticketId,
                user_id: user.id,
                user_name: user.name,
                user_phone: user.phone,
                status: 'pending',
                old_login_code: user.login_code,
                created_at: new Date().toISOString()
            };
            try {
                await supabaseFetch('tickets', 'POST', newTicket);
                await loadAllData();
                showAlert('تم إنشاء الطلب بنجاح', 'success');
                showTracking(ticketId);
            } catch (error) {
                console.error('❌ خطأ في إنشاء الطلب:', error);
                showAlert('حدث خطأ في إنشاء الطلب', 'error');
            }
        }

        // ============================================================
        //                      تتبع الطلب
        // ============================================================
        async function trackTicket() {
            const code = document.getElementById('trackingCode').value.trim();
            if (!code || code.length !== 6) {
                showAlert('يرجى إدخال رقم تتبع مكون من 6 أرقام', 'error');
                return;
            }
            try {
                const ticketData = await supabaseFetch(`tickets?id=eq.${code}&select=*`);
                if (!ticketData || ticketData.length === 0) {
                    showAlert('الطلب غير موجود. تأكد من رقم التتبع', 'error');
                    return;
                }
                const ticket = ticketData[0];
                showTracking(ticket.id);
            } catch (error) {
                console.error('❌ خطأ في تتبع الطلب:', error);
                showAlert('حدث خطأ في البحث عن الطلب', 'error');
            }
        }

        // ============================================================
        //                      عرض التتبع بالتصميم الجديد
        // ============================================================
        function showTracking(id) {
            currentTrackingId = id;
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('registerBox').style.display = 'none';
            document.getElementById('forgotPasswordBox').style.display = 'none';
            document.getElementById('trackingInputBox').style.display = 'none';
            const trackingBox = document.getElementById('trackingBox');
            trackingBox.style.display = 'block';
            trackingBox.style.display = 'flex';
            stopTrackingUpdates();
            fetchAndDisplayTicket(id);
            trackingInterval = setInterval(() => {
                fetchAndDisplayTicket(id);
            }, 3000);
        }

        async function fetchAndDisplayTicket(id) {
            try {
                const ticketData = await supabaseFetch(`tickets?id=eq.${id}&select=*`);
                if (!ticketData || ticketData.length === 0) {
                    if (document.getElementById('trackingBox').style.display !== 'none') {
                        document.getElementById('trackingContent').innerHTML =
                            '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>الطلب غير موجود أو تم حذفه</p></div>';
                        stopTrackingUpdates();
                    }
                    return;
                }
                const ticket = ticketData[0];
                const existingIdx = tickets.findIndex(t => t.id === ticket.id);
                if (existingIdx !== -1) tickets[existingIdx] = ticket;
                else tickets.push(ticket);
                const previousData = lastTicketData ? JSON.stringify(lastTicketData) : null;
                const currentData = JSON.stringify(ticket);
                const hasChanged = (previousData !== null && previousData !== currentData);
                renderTrackingContent(ticket, hasChanged);
                lastTicketData = ticket;
                if (ticket.status === 'done' || ticket.status === 'failed') {
                    stopTrackingUpdates();
                }
            } catch (error) {
                console.error('❌ خطأ في جلب التذكرة:', error);
                if (document.getElementById('trackingBox').style.display !== 'none') {
                    document.getElementById('trackingContent').innerHTML =
                        '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>حدث خطأ في جلب بيانات الطلب</p></div>';
                }
            }
        }

        function renderTrackingContent(ticket, flash = false) {
            let html = buildNewTrackingHTML(ticket);
            const contentDiv = document.getElementById('trackingContent');
            if (contentDiv) {
                contentDiv.innerHTML = html;
                if (flash) {
                    contentDiv.classList.remove('tracking-flash');
                    void contentDiv.offsetWidth;
                    contentDiv.classList.add('tracking-flash');
                }
            }
        }

        function buildNewTrackingHTML(ticket) {
            let statusClass = '',
                statusIcon = '',
                statusText = '',
                statusDesc = '';
            switch (ticket.status) {
                case 'pending':
                    statusClass = 'status-pending';
                    statusIcon = 'fa-clock';
                    statusText = '⏳ في انتظار موافقة المشرف';
                    statusDesc = 'طلبك قيد المراجعة من قبل المشرف';
                    break;
                case 'waiting':
                    statusClass = 'status-waiting';
                    statusIcon = 'fa-key';
                    statusText = '🔑 في انتظار إرسال رمز التحقق';
                    statusDesc = 'تمت الموافقة، أرسل رمز التحقق للمشرف';
                    break;
                case 'verified':
                    statusClass = 'status-verified';
                    statusIcon = 'fa-check-circle';
                    statusText = '✅ تم تأكيد الرمز';
                    statusDesc = 'تم تأكيد رمز التحقق بنجاح';
                    break;
                case 'done':
                    statusClass = 'status-done';
                    statusIcon = 'fa-check-double';
                    statusText = '🎉 تم تغيير كود الدخول';
                    statusDesc = 'تم تحديث كود الدخول بنجاح';
                    break;
                default:
                    statusClass = 'status-failed';
                    statusIcon = 'fa-times-circle';
                    statusText = '❌ فشلت العملية';
                    statusDesc = 'حدث خطأ أثناء المعالجة';
            }

            let html = `<div class="tracking-container">`;

            // === بطاقة رقم التتبع ===
            html += `
                <div class="tracking-card">
                    <div class="card-title"><i class="fas fa-hashtag"></i> رقم التتبع</div>
                    <div class="tracking-number-box">
                        <div class="label">رقم التتبع الخاص بك</div>
                        <div class="number">${ticket.id}</div>
                        <button class="copy-btn" onclick="copyTrackingNumber('${ticket.id}')">
                            <i class="fas fa-copy"></i> نسخ الرقم
                        </button>
                    </div>
                </div>
            `;

            // === بطاقة الحالة ===
            html += `
                <div class="tracking-card">
                    <div class="card-title"><i class="fas fa-info-circle"></i> حالة الطلب</div>
                    <div class="tracking-status-box ${statusClass}">
                        <div class="icon"><i class="fas ${statusIcon}"></i></div>
                        <div>
                            <div class="status-text">${statusText}</div>
                            <div class="status-desc">${statusDesc}</div>
                        </div>
                    </div>
                </div>
            `;

            // === إذا كانت الحالة waiting، عرض رمز التحقق ===
            if (ticket.status === 'waiting' && ticket.verification_code) {
                const handler = ticket.handler_id ? users.find(u => u.id === ticket.handler_id) : null;
                const handlerPhone = handler ? handler.phone : '';
                html += `
                    <div class="tracking-card">
                        <div class="card-title"><i class="fas fa-shield-alt"></i> رمز التحقق</div>
                        <div class="verification-code-box">
                            <div class="code">${ticket.verification_code}</div>
                            <div class="hint">أرسل هذا الرمز إلى المشرف لتأكيد هويتك</div>
                            ${handlerPhone ? `<div class="handler-phone"><i class="fas fa-phone"></i> ${handlerPhone}</div>` : ''}
                        </div>
                        ${handlerPhone ? `
                            <button class="btn btn-success whatsapp-btn" onclick="sendCodeToHandler('${ticket.id}')" style="margin-top:15px;">
                                <i class="fab fa-whatsapp"></i> إرسال الرمز للمشرف
                            </button>
                        ` : `
                            <button class="btn btn-success whatsapp-btn" onclick="sendCodeToAdmin('${ticket.id}')" style="margin-top:15px;">
                                <i class="fab fa-whatsapp"></i> إرسال الرمز للمشرف
                            </button>
                        `}
                    </div>
                `;
            }

            // === إذا كانت الحالة done، عرض الكود الجديد وخيار التغيير ===
            if (ticket.status === 'done' && ticket.new_login_code) {
                html += `
                    <div class="tracking-card">
                        <div class="card-title"><i class="fas fa-key"></i> كود الدخول الجديد</div>
                        <div class="code-display-box">
                            <div class="label">كود الدخول الجديد</div>
                            <div class="new-code">${ticket.new_login_code}</div>
                        </div>
                        <div class="change-code-section">
                            <div class="card-title" style="margin-bottom:10px;"><i class="fas fa-edit"></i> تغيير كود الدخول (اختياري)</div>
                            <div class="input-wrapper">
                                <input type="password" id="userNewCodeInput" placeholder="كود جديد (6 أرقام)" maxlength="6" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                                <button class="btn btn-success" onclick="userChangeCode('${ticket.id}')" style="width:auto; padding:14px 24px;">
                                    <i class="fas fa-save"></i> تحديث

        function copyTrackingNumber(trackingNumber) {
            if (trackingNumber) {
                navigator.clipboard.writeText(trackingNumber).then(() => {
                    showAlert('تم نسخ رقم التتبع', 'success');
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = trackingNumber;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showAlert('تم نسخ رقم التتبع', 'success');
                });
            }
        }

        async function refreshCodeFromTracking() {
            if (!currentTrackingId) { showAlert('حدث خطأ', 'error');
                closeTrackingRefreshModal(); return; }
            const ticket = tickets.find(t => t.id === currentTrackingId);
            if (!ticket) { showAlert('الطلب غير موجود', 'error');
                closeTrackingRefreshModal(); return; }
            const oldCode = document.getElementById('trackingOldCode').value.trim();
            const newCode = document.getElementById('trackingNewCode').value.trim();
            if (!oldCode || !newCode || newCode.length !== 6) { showAlert('يرجى إدخال الكود القديم والجديد بشكل صحيح', 'error'); return; }
            const user = users.find(u => u.id === ticket.user_id);
            if (!user) { showAlert('المستخدم غير موجود', 'error');
                closeTrackingRefreshModal(); return; }
            if (oldCode !== user.login_code) { showAlert('الكود القديم غير صحيح', 'error'); return; }
            try {
                await supabaseFetch(`users?id=eq.${user.id}`, 'PATCH', { login_code: newCode });
                await supabaseFetch(`tickets?id=eq.${ticket.id}`, 'PATCH', { new_login_code: newCode });
                await loadAllData();
                closeTrackingRefreshModal();
                showAlert('✅ تم تجديد كود الدخول بنجاح', 'success');
                showTracking(currentTrackingId);
            } catch (error) {
                showAlert('حدث خطأ في التحديث', 'error');
            }
        }

        async function processTicket(ticketId) {
            const ticket = tickets.find(t => t.id === ticketId);
            if (!ticket) return;
            closeAdminTicketsModal();
            let html = `<h3 style="color:var(--accent); margin-bottom:20px;">معالجة الطلب #${ticket.id}</h3>

                </div>`;
            if (ticket.status === 'pending') {
                html += `
                    <div style="margin:20px 0;">
                        <button class="btn btn-info" onclick="approveTicket('${ticket.id}')" style="width:100%; margin-bottom:10px;"><i class="fas fa-check"></i> الموافقة</button>
                        <input type="text" id="rejectReason" placeholder="سبب الرفض" style="width:100%; padding:14px; margin-bottom:10px; border-radius:12px; background:rgba(255,255,255,0.07); border:2px solid rgba(255,255,255,0.1); color:white;">
                        <button class="btn btn-danger" onclick="rejectTicket('${ticket.id}')" style="width:100%;">رفض الطلب</button>
                    </div>`;
            } else if (ticket.status === 'waiting') {
                html += `
                    <div style="margin:20px 0;">
                        <div style="background:rgba(0,212,255,0.1); padding:15px; border-radius:10px; margin-bottom:20px;">
                            <div style="color:var(--supervisor);">🔑 رمز التحقق:</div>
                            <div class="verification-code">${ticket.verification_code}</div>
                        </div>
                        <input type="text" id="verifyCodeInput" placeholder="أدخل الرمز من المستخدم" maxlength="6" oninput="this.value = this.value.replace(/[^0-9]/g, '')" style="width:100%; padding:14px; margin-bottom:10px; border-radius:12px; background:rgba(255,255,255,0.07); border:2px solid rgba(255,255,255,0.1); color:white;">
                        <button class="btn btn-success" onclick="verifyUserCode('${ticket.id}')" style="width:100%;">تأكيد الرمز</button>
                    </div>`;
            } else if (ticket.status === 'verified') {
                html += `
                    <div style="margin:20px 0;">
                        <div style="background:rgba(67,233,123,0.1); padding:15px; border-radius:10px; margin-bottom:20px;">✅ تم تأكيد الرمز بنجاح</div>

                            <i class="fas fa-paper-plane"></i> إرسال الكود للمستخدم عبر واتساب
                        </button>
                    </div>`;
            }
            html += `<button class="btn btn-back" onclick="closeProcessTicketModal()" style="margin-top:20px; width:100%; background:rgba(255,255,255,0.1); color:white; border:2px solid rgba(255,255,255,0.2);">إغلاق</button>`;

            document.getElementById('processTicketModal').style.display = 'flex';

        async function approveTicket(ticketId) {
            const ticket = tickets.find(t => t.id === ticketId);
            if (!ticket) return;
            const handlerId = currentUser.id;
            let code = generateSixDigitNumber();
            try {
                await supabaseFetch(`tickets?id=eq.${ticketId}`, 'PATCH', {
                    status: 'waiting',
                    verification_code: code,
                    handler_id: handlerId
                });
                await loadAllData();
                showAlert('تمت الموافقة على الطلب', 'success');
                closeProcessTicketModal();
            } catch (error) {
                showAlert('حدث خطأ', 'error');
            }
        }

        async function rejectTicket(ticketId) {
            const reason = document.getElementById('rejectReason')?.value;
            if (!reason) { showAlert('يرجى كتابة سبب الرفض', 'error'); return; }
            try {
                await supabaseFetch(`tickets?id=eq.${ticketId}`, 'PATCH', { status: 'failed', failed_reason: reason });
                await loadAllData();
                showAlert('تم رفض الطلب', 'success');
                closeProcessTicketModal();
            } catch (error) {
                showAlert('حدث خطأ', 'error');
            }
        }

        async function verifyUserCode(ticketId) {
            const inputCode = document.getElementById('verifyCodeInput')?.value.trim();
            if (!inputCode) { showAlert('يرجى إدخال الرمز', 'error'); return; }
            const ticket = tickets.find(t => t.id === ticketId);
            if (!ticket) return;
            if (inputCode === ticket.verification_code) {
                try {
                    await supabaseFetch(`tickets?id=eq.${ticketId}`, 'PATCH', { status: 'verified' });
                    await loadAllData();
                    showAlert('تم تأكيد الرمز بنجاح', 'success');
                    processTicket(ticketId);
                } catch (error) {
                    showAlert('حدث خطأ', 'error');
                }
            } else { showAlert('الرمز غير صحيح', 'error'); }
        }

        async function supervisorSendNewCode(ticketId) {
            const newCode = document.getElementById('newCodeBySupervisor')?.value.trim();
            if (!newCode || newCode.length !== 6) {
                showAlert('يرجى إدخال كود مكون من 6 أرقام', 'error');
                return;

            const ticket = tickets.find(t => t.id === ticketId);
            if (!ticket) { showAlert('الطلب غير موجود', 'error'); return; }
            const user = users.find(u => u.id === ticket.user_id);
            if (!user) { showAlert('المستخدم غير موجود', 'error'); return; }
            if (!user.phone) {
                showAlert('رقم هاتف المستخدم غير مسجل، لا يمكن إرسال الكود.', 'error');
                return;
            }

            try {
                await supabaseFetch(`users?id=eq.${user.id}`, 'PATCH', { login_code: newCode });
                await supabaseFetch(`tickets?id=eq.${ticketId}`, 'PATCH', {
                    new_login_code: newCode,

                await loadAllData();
                const message = `📋 رقم الطلب: ${ticket.id}\n🔑 كود الدخول الجديد: ${newCode}`;

                closeProcessTicketModal();
            } catch (error) {
                showAlert('حدث خطأ في إرسال الكود', 'error');
            }
        }

        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --accent: #00ff9d;
            --dark: #0c0b1e;
            --light: #ffffff;
            --card-bg: linear-gradient(145deg, #1a1a2e, #16213e);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --gradient-4: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --admin: #ffb347;
            --supervisor: #00d4ff;
            --danger: #f5576c;
            --ticket-pending: #ffb347;
            --ticket-waiting: #ff8c00;
            --ticket-verified: #4facfe;
            --ticket-done: #43e97b;
            --ticket-failed: #f5576c;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background: linear-gradient(135deg, var(--dark) 0%, #1a1036 100%);
            color: var(--light);
            min-height: 100vh;
            padding: 10px;
            font-size: 14px;
            overflow-x: hidden;
        }
        /* ===== باقي الأنماط (نفس الكود السابق) ===== */
        /* تم حذف الأنماط للاختصار، لكنها متطابقة تماماً مع الكود الأصلي */
        .locked-ticket-message {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 2px solid rgba(245,87,108,0.3);
            margin: 20px 0;
        }
        .locked-ticket-message i { color: var(--danger); margin-bottom: 15px; }
        .locked-ticket-message h3 { color: var(--danger); margin-bottom: 10px; }
        /* ... */
    </style>
</head>

        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjcWpodm1jeHdzZnd2dXRzaHpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMTc2NzYsImV4cCI6MjA4NzY5MzY3Nn0.vvBK2vR_Pgqv5X-erPiwbRPtTzETJhg0I7-jc2DVQ7Y';

        // ============================================================

        let currentUser = null;

        // ============================================================

        // ===== 1. قائمة التذاكر =====
        function showAdminTickets() {
            const allTickets = tickets.filter(t => t.status !== 'done' && t.status !== 'failed');
            const visibleTickets = allTickets.filter(t => 
                t.handler_id === null || 
                t.handler_id === currentUser.id
            );

            let html = '';
            if (visibleTickets.length === 0) {
                html = '<div class="empty-state"><i class="fas fa-ticket-alt"></i><p>لا توجد طلبات متاحة لك</p></div>';
            } else {
                visibleTickets.forEach(ticket => {
                    let statusColor = ticket.status === 'pending' ? '#ffb347' : (ticket.status === 'waiting' ? '#ff8c00' : '#4facfe');
                    let statusText = ticket.status === 'pending' ? 'في انتظار الموافقة' : (ticket.status === 'waiting' ? 'في انتظار رمز التحقق' : 'تم تأكيد الرمز');
                    let handlerName = '';
                    if (ticket.handler_id) {
                        const handler = users.find(u => u.id === ticket.handler_id);
                        if (handler) handlerName = handler.name;
                    }
                    const isOwner = (ticket.handler_id === currentUser.id);

                    html += `
                        <div class="user-card" style="margin-bottom:15px;">
                            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                                <span style="color:var(--accent);">#${ticket.id}</span>
                                <span style="background:${statusColor}; padding:4px 12px; border-radius:20px;">${statusText}</span>
                                ${isOwner ? '<span style="background:var(--supervisor); padding:4px 12px; border-radius:20px; color:black;"><i class="fas fa-check"></i> أنا المعالج</span>' : ''}
                            </div>
                            <div style="margin-bottom:10px;">
                                <div>👤 المستخدم: ${ticket.user_name}</div>
                                <div>📱 الهاتف: ${ticket.user_phone}</div>
                                <div>📅 التاريخ: ${formatDate(ticket.created_at)}</div>
                                ${handlerName ? `<div>🛡️ المشرف المعالج: ${handlerName}</div>` : ''}
                            </div>
                            <div style="display:flex; gap:10px;">
                                <button class="btn btn-info" onclick="processTicket('${ticket.id}')" style="flex:2;"><i class="fas fa-cog"></i> معالجة</button>
                                ${isOwner ? `
                                    <button class="btn btn-danger" onclick="showDeleteTicketModal('${ticket.id}')" style="flex:1;"><i class="fas fa-trash"></i> حذف</button>
                                ` : `
                                    <button class="btn btn-secondary" style="flex:1; background:rgba(255,255,255,0.1); cursor:not-allowed;" disabled>
                                        <i class="fas fa-lock"></i>
                                    </button>
                                `}
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('adminTicketsList').innerHTML = html;
            document.getElementById('adminTicketsModal').style.display = 'flex';
            updateAdminTicketsCount();
        }

        // ===== 2. عرض التذكرة =====
        function showTracking(id) {
            currentTrackingId = id;
            const ticket = tickets.find(t => t.id === id);
            if (!ticket) return;

            const isAdmin = currentUser && (currentUser.role === 'admin' || currentUser.role === 'supervisor');
            if (!isAdmin) {
                document.getElementById('trackingContent').innerHTML = `
                    <div class="locked-ticket-message">
                        <i class="fas fa-lock" style="font-size: 3rem; color: var(--danger);"></i>
                        <h3>غير مصرح</h3>
                        <p>أنت لست مشرفاً، لا يمكنك الوصول إلى هذه التذكرة.</p>
                    </div>
                `;
                return;
            }

            const isTaken = ticket.handler_id !== null && ticket.handler_id !== undefined;
            const isOwner = ticket.handler_id === currentUser.id;

            if (isTaken && !isOwner) {
                document.getElementById('trackingContent').innerHTML = `
                    <div class="locked-ticket-message">
                        <i class="fas fa-lock" style="font-size: 3rem; color: var(--danger);"></i>
                        <h3>هذه التذكرة مأخوذة من مشرف آخر 🔒</h3>
                        <p>لا يمكنك الوصول إلى تفاصيل هذه التذكرة لأنها قيد المعالجة من قبل مشرف آخر.</p>
                        <button class="btn btn-info" onclick="forceRefreshTicket('${ticket.id}')" style="margin-top:15px;">
                            <i class="fas fa-sync-alt"></i> تحديث
                        </button>
                    </div>
                `;
                return;
            }

            // عرض التفاصيل الكاملة
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('registerBox').style.display = 'none';
            document.getElementById('forgotPasswordBox').style.display = 'none';
            document.getElementById('trackingInputBox').style.display = 'none';
            document.getElementById('trackingBox').style.display = 'block';

            let statusClass = '', statusText = '';
            switch (ticket.status) {
                case 'pending': statusClass = 'status-pending'; statusText = '⏳ في انتظار موافقة المشرف'; break;
                case 'waiting': statusClass = 'status-waiting'; statusText = '🔑 في انتظار إرسال رمز التحقق'; break;
                case 'verified': statusClass = 'status-verified'; statusText = '✅ تم تأكيد الرمز'; break;
                case 'done': statusClass = 'status-done'; statusText = '🎉 تم تغيير كود الدخول'; break;
                default: statusClass = 'status-failed'; statusText = '❌ فشلت العملية';
            }

            let html = `
                <div class="tracking-number">
                    <div>رقم التتبع</div>
                    <div class="number" id="trackingNumberDisplay">${ticket.id}</div>
                    <button class="btn btn-small btn-primary" onclick="copyTrackingNumber()" style="margin-top:10px; width:auto; display:inline-flex;">
                        <i class="fas fa-copy"></i> نسخ رقم التتبع
                    </button>
                </div>
                <div class="tracking-status ${statusClass}"><i class="fas fa-info-circle"></i><div>${statusText}</div></div>
            `;

            if (!isTaken && (ticket.status === 'pending' || ticket.status === 'waiting' || ticket.status === 'verified')) {
                html += `
                    <button class="btn btn-success" onclick="takeTicket('${ticket.id}')" style="margin:15px 0;">
                        <i class="fas fa-hand-paper"></i> أخذ التذكرة
                    </button>
                `;
            }

            if (isOwner) {
                // خيارات المعالجة للمالك (نفس السابق)
                // ... (تم حذفها للاختصار لكنها موجودة في الكود الكامل)
                // زر الحذف للمالك:
                html += `
                    <button class="btn btn-danger" onclick="showDeleteTicketModal('${ticket.id}')" style="margin-top:15px; width:100%;">
                        <i class="fas fa-trash"></i> حذف التذكرة
                    </button>
                `;
            }

            html += `
                <button class="btn btn-info" onclick="forceRefreshTicket('${ticket.id}')" style="margin-top:15px; width:100%;">
                    <i class="fas fa-sync-alt"></i> تحديث يدوي
                </button>
            `;

            document.getElementById('trackingContent').innerHTML = html;
            subscribeToTicketUpdates(id);
        }

        // ===== 3. شاشة المعالجة =====
        function processTicket(ticketId) {
            // ... (نفس الكود السابق مع زر الحذف للمالك)
            // تم حذف التفاصيل للاختصار لكنها متطابقة
        }

        // ===== 4. تأكيد حذف التذكرة =====
        async function confirmDeleteTicket() {
            const ticketId = document.getElementById('deleteTicketId').value;
            const ticket = tickets.find(t => t.id === ticketId);
            if (!ticket) { showAlert('التذكرة غير موجودة', 'error'); return; }
            if (ticket.handler_id !== currentUser.id) {
                showAlert('لا يمكنك حذف هذه التذكرة لأنك لست المعالج.', 'error');
                return;
            }
            try {
                await supabaseFetch(`tickets?id=eq.${ticketId}`, 'DELETE');
                await loadAllData();
                closeDeleteTicketModal();
                showAdminTickets();
                updateAdminTicketsCount();
                showAlert('تم حذف الطلب', 'success');
            } catch (error) {
                showAlert('حدث خطأ', 'error');
            }
        }

        // ============================================================
        //                      دوال أخرى (مساعدة)
        // ============================================================
        function showDeleteTicketModal(ticketId) {
            document.getElementById('deleteTicketId').value = ticketId;
            document.getElementById('deleteTicketModal').style.display = 'flex';
        }

        function closeDeleteTicketModal() {
            document.getElementById('deleteTicketModal').style.display = 'none';
        }

        // ============================================================
        //                      دوال المصادقة (نفس السابق)
        // ============================================================
        // ... (تم حذفها للاختصار لكنها موجودة في الكود الكامل)

        // ============================================================
        //                      دوال Realtime والأخذ (نفس السابق)
        // ============================================================
        async function takeTicket(ticketId) {

        }

        // ============================================================
        //                      باقي الدوال (نفس السابق)
